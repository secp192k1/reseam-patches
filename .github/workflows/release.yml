name: Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/reseam/ci:2026.10.19
        defaults:
            run:
                shell: bash
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            BUNDLE_SIGNING_KEY_B64: ${{ secrets.BUNDLE_SIGNING_KEY_B64 }}
            RESEAM_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        steps:
            -   name: Checkout sources
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Cache dependencies
                uses: actions/cache@v6
                with:
                    path: |
                        ~/.gradle/caches
                        ~/.gradle/wrapper
                        ~/.bun/install/cache
                        ~/.npm
                    key: deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'bun.lock') }}
                    restore-keys: deps-${{ runner.os }}-

            -   name: Install Node deps
                run: bun ci

            -   name: Set up UV
                uses: astral-sh/setup-uv@v10.1.0
                with:
                    python-version: "3.14"
                    ignore-nothing-to-cache: true

            -   name: Release
                run: bun run release

            -   name: Attest release artifacts
                if: hashFiles('build/reseam/secp192k1-patches.reseam') != ''
                uses: actions/attest@v4
                with:
                    subject-path: build/reseam/secp192k1-patches.reseam
